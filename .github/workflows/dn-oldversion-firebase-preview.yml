name: DN OldVersion automatic Firebase development
# Standing owner approval: deploy DN builds to the existing ExpenseTracker Hosting site.
# Build and publish ASAP: no tests, lint, dependency audit or E2E in this development job.
# Production verification workflows are independent; never touch dn-10 here.
# Keep committed firebase.json pointing at dn-10; only change Hosting site in this runner.
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
    inputs:
      production_sha:
        description: 'SHA of a just-verified DN production release'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: dn-oldversion-development-hosting
  cancel-in-progress: true
jobs:
  deploy-development:
    if: github.ref == 'refs/heads/OldVersion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies (without audit)
        run: npm ci --no-audit --no-fund
      - name: Generate pending About release ledger
        env:
          GH_TOKEN: ${{ github.token }}
          DN_RELEASE_BASELINE_SHA: ${{ inputs.production_sha }}
        run: node scripts/generate-development-ledger.mjs
      - name: Build DN for development preview
        env:
          VITE_DEPLOY_ENV: Firebase development
        run: npm run build
      - name: Verify build entry exists
        run: test -s dist/index.html
      - name: Verify Firebase deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Firebase development deployment blocked: FIREBASE_SERVICE_ACCOUNT is unavailable. No files uploaded."
            exit 1
          fi
      - name: Point this CI runner at ExpenseTracker development site only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const rc = JSON.parse(readFileSync('.firebaserc', 'utf8'));
          if (rc.projects?.default !== 'expense-tracker-divin' || Array.isArray(config.hosting) || config.hosting?.site !== 'dn-10') {
            throw new Error('Hosting safety guard failed: expected the unchanged dn-10 production config in project expense-tracker-divin.');
          }
          config.hosting.site = 'expense-tracker-divin';
          writeFileSync('firebase.json', JSON.stringify(config, null, 2) + '\n');
          console.log('Development-only site: expense-tracker-divin; committed production site: dn-10.');
          NODE
      - name: Publish DN development to permanent ExpenseTracker Hosting
        id: firebase_development
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: expense-tracker-divin
          channelId: live
      - name: Verify exact development build is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --retry 2 --max-time 20 \
              -H 'Cache-Control: no-cache' "https://expense-tracker-divin.web.app/?build=$GITHUB_SHA" -o /tmp/dn-development-index.html \
              && cmp -s dist/index.html /tmp/dn-development-index.html \
              && curl --fail --silent --show-error --location --retry 2 --max-time 20 \
                -H 'Cache-Control: no-cache' "https://expense-tracker-divin.web.app/dn-pending-release.json?build=$GITHUB_SHA&run=$GITHUB_RUN_ID" -o /tmp/dn-development-ledger.json \
              && cmp -s dist/dn-pending-release.json /tmp/dn-development-ledger.json; then
              echo "Verified the exact development build and About ledger on Hosting."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Development Hosting did not return the exact built index. Inspect the site and Hosting target."
          exit 1
      - name: Verify the production release baseline in About
        if: inputs.production_sha != ''
        env:
          PRODUCTION_SHA: ${{ inputs.production_sha }}
        run: |
          jq -e --arg production "$PRODUCTION_SHA" --arg head "$GITHUB_SHA" '
            .status == "ready" and .production.sha == $production
            and .sourceSha == $head and ($head != $production or .commits == [])
          ' /tmp/dn-development-ledger.json
      - name: Publish development link and SHA
        shell: bash
        run: |
          {
            echo "## DN automatic development preview"
            echo "- Development site: https://expense-tracker-divin.web.app"
            echo "- Commit: $GITHUB_SHA"
            echo "- Source: OldVersion"
            echo "- Firebase project: expense-tracker-divin"
            echo "- Development Hosting site: expense-tracker-divin (live channel)"
            echo "- Production site: dn-10 (not deployed by this workflow)"
            echo "- Read-back: exact build verified"
            echo "- WARNING: Development shares the real Firebase backend; use Guest/disposable data."
          } >> "$GITHUB_STEP_SUMMARY"
