          if-no-files-found: ignore

  form-polish-230:
    # Opt-in responsive Task/Moment form QA; no Hosting publish or PR.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-form-ui]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check viewport contracts, lint and build before browser QA
        run: |
          node --test src/utils/dialogViewport.test.mjs
          npm run lint
