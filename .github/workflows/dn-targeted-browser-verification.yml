name: DN targeted browser verification (opt-in)
# Never publishes to Firebase. This suite does not run on ordinary OldVersion commits.
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-backup-navigation:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-data-backup-navigation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          e2e/iphone-data-backup-subpage.spec.js
          e2e/backup-phase7.spec.js
          e2e/iphone-settings-cloud-delete-safety.spec.js
          e2e/phase5-ui-audit-fixes.spec.js
          --workers=2

  attachment-preview-layout:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-attachment-preview]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          e2e/local-attachments-readonly.spec.js
          e2e/activity-detail-layout.spec.js
          e2e/dn-233-motion-navigation.spec.js
          --workers=2
      - run: npx playwright test e2e/iphone-story-polish-234.spec.js --grep "Journal photo framing and original preview" --workers=2

  insights-readability:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-insights-ui]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          e2e/iphone-insights-first-fold-phase1.spec.js
          e2e/iphone-route-header-density.spec.js
          --workers=2

  dashboard-activities-iphone:
    # CHG-514: actual Dashboard/Activities phone layouts and original gestures.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-dashboard-activities]')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Dashboard date views, Activity card context and existing gestures
        run: >-
          npx playwright test
          e2e/iphone-home-density-phase1.spec.js
          e2e/iphone-dashboard-photo-cards.spec.js
          e2e/iphone-activity-card-readability-phase1.spec.js
          e2e/iphone-activity-swipe-menu-phase1.spec.js
          --workers=2
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-dashboard-activities-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json

  repair-239-failed-families:
    # Five failure families at v2.3.9, without restarting the 861-case suite.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-239-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install supported Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the five formerly failing spec families
        run: >-
          npx playwright test
          e2e/dn-233-motion-acceptance.spec.js
          e2e/iphone-profile-menu-premium.spec.js
          e2e/iphone-task-page-density-230.spec.js
          e2e/mobile-command-bar.spec.js
          e2e/story-ownership-density.spec.js
          --workers=2
      - name: Preserve exact focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-239-repair-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json

  creator-visibility-motion:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-creator-motion]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify 320-430px creator size and actual sheet movement
        run: npx playwright test e2e/mobile-command-bar.spec.js e2e/iphone-premium-bottom-dock.spec.js e2e/iphone-quick-create-touch-state.spec.js --workers=2
      - name: Preserve failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-creator-visibility-motion
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json
  iphone-command-motion-focus:
    # Opt-in, no production deploy, scoped to keyboard, form and profile UX.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-iphone-command-motion]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Node contracts and guest tour
        run: npm test
      - name: Lint source
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Check mobile search, scroll and modal animations
        run: npx playwright test e2e/mobile-command-bar.spec.js e2e/iphone-quick-create-touch-state.spec.js e2e/iphone-premium-bottom-dock.spec.js --workers=2
      - name: Preserve failing screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-iphone-command-motion-focus
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json
  activity-footer-command-238:
    # Target the eight responsive regressions and the existing mobile command
    # acceptance without restarting the 850+ browser journeys.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-footer-238]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check responsive Activity footer, search-free full canvas and command
        run: npx playwright test e2e/responsive.spec.js e2e/mobile-command-bar.spec.js --workers=2
      - name: Save failure screenshots and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-238-activity-footer-focus
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json
  command-canvas-238:
    # Screenshot-reported iPhone Plus: retired tab reservation must not clip About.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-command-238]')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full mobile scroll canvas, Search and floating navigation
        run: npx playwright test e2e/mobile-command-bar.spec.js --workers=2
      - name: Preserve failing browser screenshots and trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-command-canvas-238
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json
  activity-parent-trail-237:
    # Isolate subpixel touch geometry on all iPhone-sized Activity Details.
    # This opt-in job does not publish or trigger the full browser suite.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-237-activity-trail]')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install supported Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Activity parent-trail touch targets, navigation and Guest preservation
        run: npx playwright test e2e/iphone-activity-detail-trail.spec.js --workers=2
      - name: Preserve focused browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-237-activity-trail-failure
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .verification/browser-results
            .verification/browser-results.json

  repair-233-regression:
    # Dedicated follow-up to full gate 42042647692: run changed failing spec
    # families, not the 801-case pre-release suite. Never deploy or open PRs.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-233-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install supported Chromium
        run: npx playwright install --with-deps chromium
      - name: Recheck all revised DN 2.3.3 failing browser spec families
        run: >-
          npx playwright test
          e2e/activity-cover-navigation-summary.spec.js
          e2e/activity-detail-layout.spec.js
          e2e/activity-detail-premium-220.spec.js
          e2e/activity-moment.spec.js
          e2e/activity-refinement.spec.js
          e2e/activity-time.spec.js
          e2e/all-date-times.spec.js
          e2e/applied-filter-edit.spec.js
          e2e/entry-time-default.spec.js
          e2e/independent-tasks-phase4.spec.js
          e2e/iphone-about-premium.spec.js
          e2e/iphone-activity-card-readability-phase1.spec.js
          e2e/iphone-activity-entry-modes.spec.js
          e2e/iphone-diary-journal-actions-211.spec.js
          e2e/iphone-forms-phase1.spec.js
          e2e/iphone-moment-activity-chooser-phase1.spec.js
          e2e/iphone-moment-activity-photo-card.spec.js
          e2e/iphone-moment-card-hover-stability.spec.js
          e2e/iphone-moment-title-space-230.spec.js
          e2e/iphone-quick-activity-focus-phase1.spec.js
          e2e/iphone-toast-feedback.spec.js
          e2e/moment-list-phase2.spec.js
          e2e/moment-type-first.spec.js
          e2e/release-phase9.spec.js
          e2e/responsive.spec.js
          e2e/scope-recovery.spec.js
          e2e/story-ownership-density.spec.js
          e2e/task-editor-actions-230.spec.js
          e2e/user-friendly-filters.spec.js
          --workers=4
      - name: Upload exact failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-233-repair-regression-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  toast-hit-target-233:
    # Focused follow-up for exact-SHA full browser failure 42059931537.
    # No full-suite rerun, Firebase publication or production version change.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-233-toast]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install supported Chromium
        run: npx playwright install --with-deps chromium
      - name: Check toast action geometry during actual animation and reduced motion
        run: npx playwright test e2e/iphone-toast-feedback.spec.js --workers=2
      - name: Upload focused failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-233-toast-action-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  targeted-browser:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[verify-211]'))
    # Playwright 1.56 Chromium dependency installer is supported on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check only the DN 2.1.1 previously failing browser journeys
        run: >-
          npx playwright test
          e2e/activity-cover-navigation-summary.spec.js
          e2e/activity-moment.spec.js
          e2e/iphone-about-premium.spec.js
          e2e/release-phase9.spec.js
          e2e/iphone-activity-card-readability-phase1.spec.js
          e2e/local-attachments-readonly.spec.js
          e2e/responsive.spec.js
          e2e/scope-recovery.spec.js
          e2e/story-ownership-density.spec.js
          --grep "completed Activities require reopening|the opening filtered sequence|Activity Detail and overview share|About keeps release controls|release information and refresh|Activity titles and inline status|Moment Activities share action menus|contextual transaction rows|long Activity, five workspace tabs|Sample Activity changes stay|archived parents remain readable|legacy completed status exposes|story ownership and compact Activity cards at 820px|Story, original preview and Activity menu remain"
      - name: Verify iPhone landscape Transactions and dock only
        run: >-
          npx playwright test
          e2e/iphone-premium-bottom-dock.spec.js
          --grep "short touch-enabled iPhone landscape dock|Transactions retains its own nested scroll area"
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-211-targeted-browser-failures
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  iphone-appearance-230:
    # Opt-in iPhone Appearance typography + existing preferences persistence.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-iphone-appearance]')
    runs-on: ubuntu-24.04
