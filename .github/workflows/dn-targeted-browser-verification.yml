name: DN targeted browser verification (opt-in)
# Never publishes to Firebase. This suite does not run on ordinary OldVersion commits.
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-browser:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[verify-211]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check only the DN 2.1.1 previously failing browser journeys
        run: >-
          npx playwright test
          e2e/activity-cover-navigation-summary.spec.js
          e2e/activity-moment.spec.js
          e2e/iphone-about-premium.spec.js
          e2e/release-phase9.spec.js
          e2e/iphone-activity-card-readability-phase1.spec.js
          e2e/local-attachments-readonly.spec.js
          e2e/responsive.spec.js
          e2e/scope-recovery.spec.js
          e2e/story-ownership-density.spec.js
          --grep "completed Activities require reopening|the opening filtered sequence|Activity Detail and overview share|About keeps release controls|release information and refresh|Activity titles and inline status|Moment Activities share action menus|contextual transaction rows|long Activity, five workspace tabs|Sample Activity changes stay|archived parents remain readable|legacy completed status exposes|story ownership and compact Activity cards at 820px|Story, original preview and Activity menu remain"
      - name: Verify iPhone landscape Transactions and dock only
        run: >-
          npx playwright test
          e2e/iphone-premium-bottom-dock.spec.js
          --grep "short touch-enabled iPhone landscape dock|Transactions retains its own nested scroll area"
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-211-targeted-browser-failures
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  create-keyboard-230:
    # Desktop universal + accessibility and existing mobile tap safety only.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-create-keyboard]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop focus and mobile universal create regression
        run: >-
          npx playwright test
          e2e/universal-create-desktop-keyboard-230.spec.js
          e2e/iphone-quick-create-touch-state.spec.js
          e2e/iphone-quick-activity-focus-phase1.spec.js
          --workers=2
      - name: Upload focused QA evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-create-keyboard
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  dropdown-recovery-230:
    # Shared searchable dropdowns in existing Refine / Task journeys; no publish.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-dropdown-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify dropdown recovery and Task Refine semantics
        run: >-
          npx playwright test
          e2e/dropdown-search-recovery-230.spec.js
          e2e/task-refine-dashboard-230.spec.js
          --workers=2
      - name: Upload focused QA evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-dropdown-recovery
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  iphone-pdf-touches-230:
    # Synthetic iPhone/coarse-pointer PDF Studio touch acceptance, no publish.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-iphone-pdf]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify iPhone PDF touch, previous preview and pagination
        run: >-
          npx playwright test
          e2e/iphone-pdf-tap-targets-230.spec.js
          e2e/pdf-preview-refine-230.spec.js
          e2e/pdf-studio-controls-4c.spec.js
          --workers=2
      - name: Upload screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-iphone-pdf-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  pdf-flow-230:
    # Opt-in focused preview/controls acceptance; no publishing or main writes.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-pdf-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check PDF update reachability and existing pagination/dropdowns
        run: >-
          npx playwright test
          e2e/pdf-preview-refine-230.spec.js
          e2e/pdf-studio-controls-4c.spec.js
          --workers=2
      - name: Upload synthetic PDF UI evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-pdf-flow
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  form-polish-230:
    # Opt-in responsive Task/Moment form QA; no Hosting publish or PR.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-form-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify compact form layout and inline validation
        run: npx playwright test e2e/form-polish-230.spec.js --workers=2
      - name: Upload focused QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-form-ui
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  search-recovery-230:
    # Opt-in synthetic Guest UI test. No Firebase/Vercel publishing.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-search-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check query-only clearing and lightweight Task recovery
        run: npx playwright test e2e/search-recovery-230.spec.js --workers=2
      - name: Upload focused recovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-search-recovery
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  ui-230:
    # Opt-in visual/UI gate only. Never deploy, bump versions or run the long full suite.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify DN 2.3 Tasks, Dashboard, Refine and responsive layouts
        run: >-
          npx playwright test
          e2e/independent-tasks-phase4.spec.js
          e2e/ui-polish-230.spec.js
          e2e/refine-sheet-230.spec.js
      - name: Upload synthetic visual evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-ui-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  audit-230:
    # Screenshot-only synthetic Guest audit. Never deploy.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[audit-230-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture synthetic cross-app routes and UI metrics
        run: npx playwright test e2e/cross-app-visual-audit-230.spec.js
      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-cross-app-audit
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  phase5-230:
    # Owner-approved in-scope UI acceptance; never deploys to Firebase or Vercel.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-phase5]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify compact Settings, shared Refine, Story, PDF and Tasks
        run: >-
          npx playwright test
          e2e/phase5-ui-audit-fixes.spec.js
          e2e/iphone-settings-premium.spec.js
          e2e/iphone-settings-filter-defaults.spec.js
          e2e/shared-refine-premium.spec.js
          e2e/pdf-studio-controls-4c.spec.js
          e2e/story-paper-contrast-220.spec.js
          e2e/independent-tasks-phase4.spec.js
      - name: Upload reviewed screenshots and targeted failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-phase5-ui-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  task-polish-230:
    # New Task Refine / Dashboard and shared lightweight filter/sort acceptance.
    # Synthetic Guest Chromium only; never deploys or touches account data.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-task-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Task Refine, Dashboard and shared UI at mobile and desktop
        run: >-
          npx playwright test
          e2e/task-refine-dashboard-230.spec.js
          e2e/independent-tasks-phase4.spec.js
          e2e/ui-polish-230.spec.js
          e2e/shared-refine-premium.spec.js
          e2e/phase5-ui-audit-fixes.spec.js
      - name: Upload screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-task-refine-dashboard-ui
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  appearance-polish-230:
    # Synthetic Guest acceptance for the dedicated Appearance page and
    # navigation around Settings. Does not mutate real user records or deploy.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-appearance]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Settings navigation, Appearance, list defaults and reset safety
        run: >-
          npx playwright test
          e2e/iphone-settings-premium.spec.js
          e2e/iphone-settings-defaults-navigation.spec.js
          e2e/iphone-settings-reset-scope.spec.js
          e2e/iphone-settings-filter-defaults.spec.js
          e2e/iphone-settings-cloud-delete-safety.spec.js
          e2e/cross-app-visual-audit-230.spec.js
          e2e/settings-appearance-baseline-230.spec.js
      - name: Upload screenshot evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-appearance-and-cross-app-ui
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  appearance-230:
    # In-scope settings architecture and adjacent app regression only.
    # Synthetic Guest, no deploy, migration or real account writes.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-appearance]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Appearance, Settings reset, Story design and adjacent filter flows
        run: >-
          npx playwright test
          e2e/settings-appearance-preferences-230.spec.js
          e2e/iphone-dock-label-230.spec.js
          e2e/iphone-settings-premium.spec.js
          e2e/story-design-phase1.spec.js
          e2e/iphone-settings-defaults-navigation.spec.js
          e2e/iphone-settings-reset-scope.spec.js
          e2e/iphone-settings-cloud-delete-safety.spec.js
          e2e/phase5-ui-audit-fixes.spec.js
      - name: Upload synthetic screenshots and any browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-appearance-ui-review
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore
