    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify iPhone Appearance choices and existing preferences
        run: >-
          npx playwright test
          e2e/iphone-appearance-legibility-230.spec.js
          e2e/settings-appearance-preferences-230.spec.js
          e2e/iphone-settings-premium.spec.js
          e2e/story-design-phase1.spec.js
          --workers=2
      - name: Upload screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-iphone-appearance-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  iphone-task-story-230:
    # Opt-in iPhone Tasks Story touch/readability + existing status flow.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-iphone-task-story]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify iPhone Task Story and saved status semantics
        run: >-
          npx playwright test
          e2e/iphone-task-story-status-230.spec.js
          e2e/moment-story-phase4.spec.js
          --grep "Task Story status remains|Tasks status controls persist|Task completion is disabled"
          --workers=2
      - name: Upload screenshots and browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-iphone-task-story-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
