      - name: Recheck the four failures and adjacent filter accessibility
        run: >-
          npx playwright test
          e2e/refine-task-recovery-230.spec.js
          e2e/task-refine-dashboard-230.spec.js
          e2e/user-friendly-filters.spec.js
          e2e/shared-filter-single-row.spec.js
