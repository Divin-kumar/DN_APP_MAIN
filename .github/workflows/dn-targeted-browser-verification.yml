name: DN targeted browser verification (opt-in)
# Never publishes to Firebase. This suite does not run on ordinary OldVersion commits.
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-browser:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[verify-211]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check only the DN 2.1.1 previously failing browser journeys
        run: >-
          npx playwright test
          e2e/activity-cover-navigation-summary.spec.js
          e2e/activity-moment.spec.js
          e2e/iphone-about-premium.spec.js
          e2e/release-phase9.spec.js
          e2e/iphone-activity-card-readability-phase1.spec.js
          e2e/local-attachments-readonly.spec.js
          e2e/responsive.spec.js
          e2e/scope-recovery.spec.js
          e2e/story-ownership-density.spec.js
          --grep "completed Activities require reopening|the opening filtered sequence|Activity Detail and overview share|About keeps release controls|release information and refresh|Activity titles and inline status|Moment Activities share action menus|contextual transaction rows|long Activity, five workspace tabs|Sample Activity changes stay|archived parents remain readable|legacy completed status exposes|story ownership and compact Activity cards at 820px|Story, original preview and Activity menu remain"
      - name: Verify iPhone landscape Transactions and dock only
        run: >-
          npx playwright test
          e2e/iphone-premium-bottom-dock.spec.js
          --grep "short touch-enabled iPhone landscape dock|Transactions retains its own nested scroll area"
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dn-211-targeted-browser-failures
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  ui-230:
    # Opt-in visual/UI gate only. Never deploy, bump versions or run the long full suite.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verify-230-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify DN 2.3 Tasks, Dashboard, Refine and responsive layouts
        run: >-
          npx playwright test
          e2e/independent-tasks-phase4.spec.js
          e2e/ui-polish-230.spec.js
          e2e/refine-sheet-230.spec.js
      - name: Upload synthetic visual evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-ui-evidence
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  audit-230:
    # Screenshot-only synthetic Guest audit. Never deploy.
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[audit-230-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture synthetic cross-app routes and UI metrics
        run: npx playwright test e2e/cross-app-visual-audit-230.spec.js
      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-230-cross-app-audit
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore
