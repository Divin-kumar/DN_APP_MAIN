name: DN 2.3.4 iPhone Story visual acceptance (opt-in, no deployment)
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story-iphone:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[verify-234]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify narrow-phone Story, contrast and existing task actions
        run: >-
          npx playwright test
          e2e/iphone-story-polish-234.spec.js
          e2e/story-paper-contrast-220.spec.js
          e2e/iphone-task-story-status-230.spec.js
          --workers=2
      - name: Preserve synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-234-story-iphone
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore
