name: DN 2.3.4 iPhone Story visual acceptance (opt-in, no deployment)
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story-iphone:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[verify-234]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify narrow-phone Story, contrast and existing task actions
        run: >-
          npx playwright test
          e2e/iphone-story-polish-234.spec.js
          e2e/story-paper-contrast-220.spec.js
          e2e/iphone-task-story-status-230.spec.js
          e2e/iphone-moment-header-metrics.spec.js
          e2e/iphone-moment-nav-premium.spec.js
          --workers=2
      - name: Preserve synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dn-234-story-iphone
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  tasks-settings:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      contains(github.event.head_commit.message, '[verify-tasks-settings]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify Tasks and impacted Settings flows
        run: >-
          npx playwright test
          e2e/tasks-settings-refinement-234.spec.js
          e2e/task-refine-dashboard-230.spec.js
          e2e/task-actions-calendar-230.spec.js
          e2e/task-editor-actions-230.spec.js
          e2e/account-tasks-sync-230.spec.js
          e2e/independent-task-backup-v4.spec.js
          e2e/iphone-settings-task-screenshot-fixes-230.spec.js
          e2e/settings-appearance-preferences-230.spec.js
          e2e/dn-233-ui-acceptance.spec.js
          --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dn-tasks-settings-refinement
          path: |
            .verification/browser-results
            .verification/browser-results.json
          retention-days: 7

  release-repair:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      contains(github.event.head_commit.message, '[verify-234-release-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recheck About failures and release information
        run: npx playwright test e2e/iphone-about-premium.spec.js e2e/release-phase9.spec.js --workers=2
      - name: Build candidate
        env:
          VITE_DEPLOY_ENV: Production
        run: npm run build
      - name: Check offline originals and PDF
        run: npm run test:production
      - name: Build previous release fixture
        env:
          DN_UPGRADE_BASE_SHA: dfe40bbc90b0a740cf2dd44132d72997634f12c7
        run: |
          git fetch --no-tags --depth=1 origin "$DN_UPGRADE_BASE_SHA"
          mkdir -p .verification/phase9/previous
          git archive "$DN_UPGRADE_BASE_SHA" | tar -x -C .verification/phase9/previous
          ln -s "$GITHUB_WORKSPACE/node_modules" .verification/phase9/previous/node_modules
          npm --prefix .verification/phase9/previous run build
      - name: Check upgrade preserves data and originals
        run: npm run test:upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dn-234-release-repair
          include-hidden-files: true
          retention-days: 7
          path: |
            .verification/browser-results
            .verification/browser-results.json
            .verification/production-shell
            .verification/release-upgrade

  pdf-cancellation-repair:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      contains(github.event.head_commit.message, '[verify-235-pdf]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify cancelled PDF exclusion and existing exports
        run: npx playwright test e2e/pdf-content-selection.spec.js e2e/pdf-studio-controls-4c.spec.js e2e/pdf-cancelled-activities-235.spec.js e2e/pdf-studio-phase6.spec.js e2e/pdf-studio-searchable-220.spec.js e2e/iphone-about-premium.spec.js e2e/release-phase9.spec.js --workers=2
      - name: Build candidate
        env:
          VITE_DEPLOY_ENV: Production
        run: npm run build
      - name: Check offline originals and PDF
        run: npm run test:production
      - name: Build previous release fixture
        env:
          DN_UPGRADE_BASE_SHA: dfe40bbc90b0a740cf2dd44132d72997634f12c7
        run: |
          git fetch --no-tags --depth=1 origin "$DN_UPGRADE_BASE_SHA"
          mkdir -p .verification/phase9/previous
          git archive "$DN_UPGRADE_BASE_SHA" | tar -x -C .verification/phase9/previous
          ln -s "$GITHUB_WORKSPACE/node_modules" .verification/phase9/previous/node_modules
          npm --prefix .verification/phase9/previous run build
      - name: Check upgrade preserves data and originals
        run: npm run test:upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dn-235-pdf-exclusion
          include-hidden-files: true
          retention-days: 7
          path: |
            .verification/browser-results
            .verification/browser-results.json
            .verification/production-shell
            .verification/release-upgrade

  shared-list-appearance:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (contains(github.event.head_commit.message, '[verify-list-appearance]') ||
       contains(github.event.head_commit.message, '[verify-list-polish]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check shared list styling and affected interactions
        if: contains(github.event.head_commit.message, '[verify-list-appearance]')
        run: >-
          npx playwright test
          e2e/shared-list-appearance.spec.js
          e2e/task-actions-calendar-230.spec.js
          e2e/tasks-settings-refinement-234.spec.js
          e2e/iphone-moment-activity-photo-card.spec.js
          e2e/iphone-activity-card-readability-phase1.spec.js
          e2e/iphone-activity-swipe-menu-phase1.spec.js
          e2e/moment-list-phase2.spec.js
          e2e/iphone-code-lists-premium.spec.js
          e2e/dropdown-search-recovery-230.spec.js
          e2e/shared-filter-single-row.spec.js
          e2e/task-refine-dashboard-230.spec.js
          e2e/user-friendly-sort.spec.js
          e2e/transaction-payment-phase5.spec.js
          e2e/dn-233-motion-navigation.spec.js
          e2e/pdf-content-selection.spec.js
          --workers=2
      - name: Check final Moment polish and cross-screen surfaces
        if: contains(github.event.head_commit.message, '[verify-list-polish]')
        run: npx playwright test e2e/shared-list-appearance.spec.js e2e/moment-list-phase2.spec.js e2e/iphone-moment-card-hover-stability.spec.js --workers=2
      - name: Build application
        env:
          VITE_DEPLOY_ENV: Production
        run: npm run build
      - name: Check offline originals and PDF
        run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dn-shared-list-appearance
          include-hidden-files: true
          retention-days: 7
          path: |
            .verification/browser-results
            .verification/browser-results.json
            .verification/production-shell

  desktop-shell:
    if: github.ref == 'refs/heads/OldVersion' && contains(github.event.head_commit.message, '[verify-desktop-shell]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/desktop-shell.spec.js e2e/dn-233-motion-navigation.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dn-desktop-shell
          path: .verification
          retention-days: 7
