name: DN production Firebase Hosting
# Opt-in OldVersion only. Production never executes browser tests: a separately
# completed successful full pre-release workflow on the exact source SHA is required
# for X.Y.0 and explicitly full-verified releases. Publication keeps fast gates.
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'Fast patch deploy, or require prior full pre-release verification; X.Y.0 always requires full'
        required: true
        default: fast
        type: choice
        options:
          - full
          - fast
permissions:
  contents: read
  actions: read
concurrency:
  group: dn-firebase-hosting-production
  cancel-in-progress: false
jobs:
  production-release:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[deploy-live]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Choose verification tier
        id: verification
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.validation_mode }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          patch="${version##*.}"
          release_message="$(git log -1 --format=%B)"
          # Apply forced full gates before considering the manual patch default.
          # Reading HEAD also preserves [release-full] for manual dispatch.
          if [[ "$patch" == '0' || "$release_message" == *'[release-full]'* ]]; then
            mode=full
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            mode="$REQUESTED_MODE"
          else
            mode=fast
          fi
          if [[ "$mode" != fast && "$mode" != full ]]; then
            echo "::error::Choose fast or full verification."
            exit 1
          fi
          if [[ "$patch" == '0' && "$mode" != full ]]; then
            echo "::error::Feature release v$version requires full verification."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Verification tier: $mode for v$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Verify unit tests and lint
        run: |
          npm test
          npm run lint
      - name: Build production release
        env:
          VITE_DEPLOY_ENV: Production
        run: npm run build
      - name: Require successful full pre-release verification for exact source SHA
        if: steps.verification.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed if the independent check has not finished successfully.
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/dn-oldversion-full-pre-release.yml/runs?head_sha=${GITHUB_SHA}&per_page=100")"
          if ! jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | any(.[]; .head_sha == $sha and .head_branch == "OldVersion" and .status == "completed" and .conclusion == "success")' <<< "$runs" > /dev/null; then
            echo "::error::Full pre-release checks must pass for this exact OldVersion commit before production may publish."
            echo "::error::Run the separate DN full pre-release verification workflow, then launch this release after it passes."
            exit 1
          fi
          echo "Verified completed full pre-release checks for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Block duplicate or downgraded live version
        run: node scripts/check-hosting-release-version.mjs
      - name: Require configured Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Production publication is blocked: add the FIREBASE_SERVICE_ACCOUNT GitHub Actions secret for Firebase project expense-tracker-divin. No files were uploaded."
            exit 1
          fi
      - name: Publish to permanent dn-10 Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: expense-tracker-divin
          channelId: live
      - name: Read back exact production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --retry 2 --max-time 20 \
              -H 'Cache-Control: no-cache' "https://dn-10.web.app/?build=$GITHUB_SHA" -o /tmp/dn-live-index.html \
              && cmp -s dist/index.html /tmp/dn-live-index.html; then
              echo "Verified production index bytes match this exact Vite build."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Firebase Hosting returned an index that does not match the release build. Investigate the published site."
          exit 1
      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## DN production release"
            echo "- Site: https://dn-10.web.app"
            echo "- Firebase project: expense-tracker-divin"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Verification tier: ${{ steps.verification.outputs.mode }}"
            echo "- Always verified: unit tests, lint, dependency audit, production build, newer live version and Firebase credential"
            echo "- Full tier only: separately completed green full pre-release workflow verified at exact source SHA; no browser execution in production"
            echo "- Verification: live index bytes match dist/index.html"
          } >> "$GITHUB_STEP_SUMMARY"
