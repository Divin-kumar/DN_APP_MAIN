name: DN production Firebase Hosting
# Opt-in OldVersion only: [deploy-live] publishes a patch; X.Y.0 feature releases
# and [release-full] require the full browser/offline/PDF/upgrade gate.
# All published builds still require unit/lint/audit/build, newer version and exact read-back.
on:
  push:
    branches: [OldVersion]
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'Fast patch checks or full release verification (X.Y.0 always full)'
        required: true
        default: full
        type: choice
        options:
          - full
          - fast
permissions:
  contents: read
concurrency:
  group: dn-firebase-hosting-production
  cancel-in-progress: false
jobs:
  production-release:
    if: >-
      github.ref == 'refs/heads/OldVersion' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[deploy-live]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Choose verification tier
        id: verification
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.validation_mode }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          patch="${version##*.}"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            mode="$REQUESTED_MODE"
          elif [[ "$patch" == '0' || "$RELEASE_MESSAGE" == *'[release-full]'* ]]; then
            mode=full
          else
            mode=fast
          fi
          if [[ "$mode" != fast && "$mode" != full ]]; then
            echo "::error::Choose fast or full verification."
            exit 1
          fi
          if [[ "$patch" == '0' && "$mode" != full ]]; then
            echo "::error::Feature release v$version requires full verification."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Verification tier: $mode for v$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Verify unit tests and lint
        run: |
          npm test
          npm run lint
      - name: Install Chromium
        if: steps.verification.outputs.mode == 'full'
        run: npx playwright install --with-deps chromium
      - name: Verify responsive browser journeys
        if: steps.verification.outputs.mode == 'full'
        run: npm run test:e2e
      - name: Build production release
        env:
          VITE_DEPLOY_ENV: Production
        run: npm run build
      - name: Verify built shell, offline originals and PDF export
        if: steps.verification.outputs.mode == 'full'
        run: npm run test:production
      - name: Build the reviewed previous-release upgrade fixture
        if: steps.verification.outputs.mode == 'full'
        env:
          DN_UPGRADE_BASE_SHA: dfe40bbc90b0a740cf2dd44132d72997634f12c7
        run: |
          git fetch --no-tags --depth=1 origin "$DN_UPGRADE_BASE_SHA"
          mkdir -p .verification/phase9/previous
          git archive "$DN_UPGRADE_BASE_SHA" | tar -x -C .verification/phase9/previous
          ln -s "$GITHUB_WORKSPACE/node_modules" .verification/phase9/previous/node_modules
          npm --prefix .verification/phase9/previous run build
      - name: Verify release upgrade preserves records, settings and original attachments
        if: steps.verification.outputs.mode == 'full'
        run: npm run test:upgrade
      - name: Block duplicate or downgraded live version
        run: node scripts/check-hosting-release-version.mjs
      - name: Require configured Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Production publication is blocked: add the FIREBASE_SERVICE_ACCOUNT GitHub Actions secret for Firebase project expense-tracker-divin. No files were uploaded."
            exit 1
          fi
      - name: Publish to permanent dn-10 Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: expense-tracker-divin
          channelId: live
      - name: Read back exact production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --retry 2 --max-time 20 \
              -H 'Cache-Control: no-cache' "https://dn-10.web.app/?build=$GITHUB_SHA" -o /tmp/dn-live-index.html \
              && cmp -s dist/index.html /tmp/dn-live-index.html; then
              echo "Verified production index bytes match this exact Vite build."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Firebase Hosting returned an index that does not match the release build. Investigate the published site."
          exit 1
      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## DN production release"
            echo "- Site: https://dn-10.web.app"
            echo "- Firebase project: expense-tracker-divin"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Verification tier: ${{ steps.verification.outputs.mode }}"
            echo "- Always verified: unit tests, lint, dependency audit, production build, newer live version and Firebase credential"
            echo "- Full tier only: Chromium journeys, offline/PDF/originals and previous-release upgrade preservation"
            echo "- Verification: live index bytes match dist/index.html"
          } >> "$GITHUB_STEP_SUMMARY"
