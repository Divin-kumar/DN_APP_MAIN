name: Documentation governance (OldVersion only)
# Runs only on pushes to OldVersion and PRs targeting OldVersion.
on:
  push:
    branches: ['OldVersion']
  pull_request:
    branches: ['OldVersion']
permissions:
  contents: read
jobs:
  application-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node unit tests
        run: npm test
      - name: Build production application
        run: npm run build
  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all history needed for diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require documentation and audit for OldVersion changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$BASE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA" || true)"
          echo "Changed files:"
          printf '%s\n' "$changed"
          if [[ -z "$changed" ]]; then exit 0; fi
          if ! grep -Fxq "docs/MASTER_SOURCE_OF_TRUTH.md" <<< "$changed"; then
            echo "::error::OldVersion changes require an update to docs/MASTER_SOURCE_OF_TRUTH.md"
            exit 1
          fi
          if ! grep -Fxq "docs/CHANGE_AUDIT_LOG.md" <<< "$changed"; then
            echo "::error::OldVersion changes require a new top audit entry in docs/CHANGE_AUDIT_LOG.md"
            exit 1
          fi
          echo "Documentation files changed; verify factual quality during review."
      - name: Enforce four-Markdown-file budget
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' README.md AGENTS.md docs/MASTER_SOURCE_OF_TRUTH.md docs/CHANGE_AUDIT_LOG.md | sort)"
          actual="$(git ls-files '*.md' '*.MD' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Only the four canonical Markdown files are permitted."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
      - name: Verify prior audit entries are preserved
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$BASE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then exit 0; fi
          if ! git cat-file -e "$base:docs/CHANGE_AUDIT_LOG.md" 2>/dev/null; then exit 0; fi
          node scripts/check-audit-log.mjs "$base"
