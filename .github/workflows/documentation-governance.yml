name: Documentation governance (OldVersion only)
# Runs only on pushes to OldVersion and PRs targeting OldVersion.
on:
  push:
    branches: ['OldVersion']
  pull_request:
    branches: ['OldVersion']
permissions:
  contents: read
jobs:
  application-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Run Node unit tests
        run: npm test
      - name: Lint application and tests
        run: npm run lint
      - name: Install Chromium for synthetic browser regressions
        run: npx playwright install --with-deps chromium
      - name: Test Activity and Moment browser journeys
        run: npm run test:e2e
      - name: Build production application
        run: npm run build
      - name: Verify built shell, offline originals and PDF export
        run: npm run test:production
      - name: Build the reviewed pre-release upgrade fixture
        env:
          DN_UPGRADE_BASE_SHA: dfe40bbc90b0a740cf2dd44132d72997634f12c7
        run: |
          git fetch --no-tags --depth=1 origin "$DN_UPGRADE_BASE_SHA"
          mkdir -p .verification/phase9/previous
          git archive "$DN_UPGRADE_BASE_SHA" | tar -x -C .verification/phase9/previous
          ln -s "$GITHUB_WORKSPACE/node_modules" .verification/phase9/previous/node_modules
          npm --prefix .verification/phase9/previous run build
      - name: Verify the release update preserves records, preferences and originals
        run: npm run test:upgrade
  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all history needed for diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Review determines factual master impact and whether a meaningful change
      # needs new evidence. Routine edits do not require artificial document diffs.
      - name: Enforce five approved Markdown documents
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' README.md AGENTS.md docs/MASTER_SOURCE_OF_TRUTH.md docs/CHANGE_AUDIT_LOG.md docs/DN_BUSINESS_GUIDE.md | sort)"
          actual="$(git ls-files '*.md' '*.MD' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Only the five approved Markdown files are permitted."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
      - name: Validate audit ordering and preserve historical entries
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$BASE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            node scripts/check-audit-log.mjs
          else
            # A supplied but unavailable commit is an error, not permission to
            # skip preservation. Only a genuinely absent old log has no baseline.
            git cat-file -e "$base^{commit}"
            if git cat-file -e "$base:docs/CHANGE_AUDIT_LOG.md" 2>/dev/null; then
              node scripts/check-audit-log.mjs "$base"
            else
              node scripts/check-audit-log.mjs
            fi
          fi
      - name: Check documentation links and current route contracts
        run: node scripts/check-documentation.mjs
      - name: Read public Firebase and Vercel shell fingerprints (non-release, non-gating)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-live-builds.mjs | tee -a "$GITHUB_STEP_SUMMARY"
